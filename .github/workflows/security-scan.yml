name: Security Scan

on:
  push:
    branches: [main]

jobs:
  basic-scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start local web server
        run: |
          python3 -m http.server 8080 --directory docs >/tmp/cosmic-wonder-http.log 2>&1 &
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "The Cosmic Wonder site did not start from the docs/ directory."
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          allow_issue_writing: false
          artifact_name: zap-scan
