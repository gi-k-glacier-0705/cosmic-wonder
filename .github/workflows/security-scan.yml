name: Security Scan

on:
  push:
    branches: [main]

jobs:
  basic-scan:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start local web server
        run: |
          python3 -m http.server 8080 &
          sleep 3

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
