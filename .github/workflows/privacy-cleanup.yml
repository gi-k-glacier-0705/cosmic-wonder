name: Privacy cleanup

on:
  push:
    paths:
      - "docs/.privacy-cleanup-trigger"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'privacy cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace public author metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              "docs/index.html": ('meta name="author" content="[Julia C. Holmes]"', 'meta name="author" content="The Laughing Philosophress"'),
              "docs/nervous-system.html": ('meta name="author" content="Julia C. Holmes"', 'meta name="author" content="The Laughing Philosophress"'),
          }
          for name, (old, new) in replacements.items():
              p = Path(name)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f"Expected exactly one target in {name}; found {s.count(old)}")
              p.write_text(s.replace(old, new))
          PY
      - name: Remove trigger and commit
        run: |
          rm -f docs/.privacy-cleanup-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/nervous-system.html docs/.privacy-cleanup-trigger
          git commit -m "privacy cleanup"
          git push
