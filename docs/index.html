<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laughing Philosophress</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; }
        .container { width: 80%; margin: auto; overflow: hidden; }
        .card { width: 300px; height: 400px; perspective: 1000px; margin: 20px; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; }
        .card-front { background: #fff; display: flex; align-items: center; justify-content: center; }
        .card-back { background: #2980b9; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; color: white; }
        .flip-button { cursor: pointer; padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; }
        .timer { font-size: 2em; margin: 20px; }
        nav { display: flex; justify-content: space-around; margin: 20px 0; background: #2980b9; padding: 10px; color: white; }
        nav a { color: white; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
        <h1>What weighs on your mind?</h1>
        <div class="timer" id="timer">00:00:00</div>
        <div class="card" onclick="flipCard()">
            <div class="card-inner" id="cardInner">
                <div class="card-front">
                    <h2>Click to Flip!</h2>
                </div>
                <div class="card-back">
                    <h2>Laughing Philosophress</h2>
                </div>
            </div>
        </div>
    </div>
    <script>
        let seconds = 0;
        setInterval(() => {
            seconds++;
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            document.getElementById('timer').innerHTML =
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(secs).padStart(2, '0');
        }, 1000);

        function flipCard() {
            const card = document.getElementById('cardInner');
            card.style.transform = card.style.transform === 'rotateY(180deg)' ? 'rotateY(0deg)' : 'rotateY(180deg)';
        }
    </script>
</body>
</html>
